<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Students Data Managment</h1>
    </header>

    <main>
        <form>
            <div id="inputs">
                <div class="inputGroup">
                    <label>Nome do aluno<span class="required">*</span></label>
                    <input required placeholder="Lucas de Souza Siqueira"/>
                </div>
    
                <div class="inputGroup">
                    <label>Email do aluno<span class="required">*</span></label>
                    <input required placeholder="lucas.s.siqueira.2009@gmail.com"/>
                </div>
    
                <div class="inputGroup">
                    <label>Sala do aluno<span class="required">*</span></label>
                    <input required placeholder="2º DS (AMS) - Tarde"/>
                </div>
    
                <div class="inputGroup">
                    <label>Nascimento do aluno</label>
                    <input type="date"/>
                </div>
            </div>

            <button type="submit">
                Registrar aluno
            </button>
        </form>
        
    </main>

    <footer>
        <h2>Feito por <a href="https://www.linkedin.com/in/lucasdesouzasiqueira/" target="_blank">Lucas Siqueira</a></h2>
    </footer>
</body>
</html>
