<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Data Creator</title>
    <link rel="stylesheet" href="./index/style.css">
</head>
<body>

    <!-- Header da página -->
    <header>
        <h1>Students Data Creator</h1>
        <a id="adminPanel" href="./admin/admin.html">
            <i data-lucide="cog" width="35" height="35" stroke-width="1.5"></i>
        </a>
    </header>

    <!-- Conteúdo principal da página -->
    <main>
        <!-- Formulário -->
        <form>
            <div id="inputs">
                <div class="inputGroup">
                    <label for="name">Student's name<span class="required">*</span></label>
                    <input id="name" required name="name" type="text" placeholder="Lucas de Souza Siqueira" autocomplete="name"/>
                </div>
    
                <div class="inputGroup">
                    <label for="email">Student's email<span class="required">*</span></label>
                    <input id="email" required name="email" type="email" placeholder="lucas.s.siqueira.2009@gmail.com" autocomplete="email"/>
                </div>
    
                <div class="inputGroup">
                    <label for="class">Student's class</label>
                    <input id="class" name="class" type="text" placeholder="2º DS (AMS) - Tarde"/>
                </div>
    
                <div class="inputGroup">
                    <label for="birth">Student's birth date<span class="required">*</span></label>
                    <input id="birth" required name="birth" type="date" autocomplete="bday"/>
                </div>
            </div>

            <button type="submit">
                Register student
            </button>
        </form>

        <!-- Linha divisora -->
        <div class="hr"></div>

        <!-- Tabela com os alunos registrados -->
        <div id="registredStudents">
            <button id="refreshTable">Refresh <i data-lucide="rotate-cw" width="20px"></i></button>

            <h1>Registred Students</h1>

            <table>
                <tr id="tableHeader">
                    <th>Name</th>
                    <th>Email</th>
                    <th>Class</th>
                    <th>Birth date</th>
                </tr>
            </table>
        </div>
    </main>

    <!-- Aviso vazio -->
    <div id="warn">
    </div>

    <!-- Rodapé da página -->
    <footer>
        <h2>Feito por <a href="https://www.linkedin.com/in/lucasdesouzasiqueira/" target="_blank">Lucas Siqueira</a></h2>
    </footer>
    
    <!-- Importação dos scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./script.js"></script>
</body>
</html>
