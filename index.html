<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Data Creator</title>
    <link rel="stylesheet" href="./index/style.css">
</head>
<body>
    <header>
        <h1>Students Data Creator</h1>
        <a id="adminPanel" href="./admin/admin.html">
            <i data-lucide="cog" width="35" height="35" stroke-width="1.5"></i>
        </a>
    </header>

    <main>
        <form>
            <div id="inputs">
                <div class="inputGroup">
                    <label>Student's name<span class="required">*</span></label>
                    <input required placeholder="Lucas de Souza Siqueira"/>
                </div>
    
                <div class="inputGroup">
                    <label>Student's email<span class="required">*</span></label>
                    <input required placeholder="lucas.s.siqueira.2009@gmail.com"/>
                </div>
    
                <div class="inputGroup">
                    <label>Student's class<span class="required">*</span></label>
                    <input required placeholder="2º DS (AMS) - Tarde"/>
                </div>
    
                <div class="inputGroup">
                    <label>Student's birth date</label>
                    <input type="date"/>
                </div>
            </div>

            <button type="submit">
                Register student
            </button>
        </form>

        <div class="hr"></div>

        <div id="registredStudents">
            <button id="refreshTable">Refresh <i data-lucide="rotate-cw" width="20px"></i></button>

            <h1>Registred Students</h1>

            <table>
                <tr id="tableHeader">
                    <th>Name</th>
                    <th>Email</th>
                    <th>Class</th>
                    <th>Birth date</th>
                </tr>
            </table>
        </div>
    </main>

    <div id="warn">
    </div>

    <footer>
        <h2>Feito por <a href="https://www.linkedin.com/in/lucasdesouzasiqueira/" target="_blank">Lucas Siqueira</a></h2>
    </footer>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./index/script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
